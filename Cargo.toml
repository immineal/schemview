[package]
name = "schemview"
version = "1.0.0"
edition = "2021"
description = "Fast native viewer for Minecraft .litematic, .schematic, .schem and structure .nbt files"
authors = ["Linus Linhof"]
license = "MIT"
repository = "https://github.com/immineal/schemview"
readme = "README.md"
keywords = ["minecraft", "litematica", "schematic", "viewer", "worldedit"]
categories = ["graphics", "rendering", "visualization"]
exclude = ["docs/*.gif"]

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
flate2 = "1.1"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
png = "0.18"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
