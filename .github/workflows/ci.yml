name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked
      - name: Load and mesh the example file (no window)
        if: runner.os != 'Windows'
        run: ./target/release/schemview --stats examples/blocks.schem

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native
      - run: cargo install cargo-ndk --locked
      - name: Build the Android library (the APK is signed and released from a local build)
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME cargo ndk -t arm64-v8a -P 26 build --release --locked --manifest-path android/native/Cargo.toml
